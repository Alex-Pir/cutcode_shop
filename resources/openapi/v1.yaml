openapi: 3.1.0
info:
  title: CutCodeShop V1
  description: ''
  version: 1.0.0
servers:
  - url: 'http://shop.local/api'
    description: 'Local API servers'
tags:
  - name: Authenticate
  - name: Catalog
  - name: Cart
paths:
  /authenticate:
    post:
      tags:
        - Authenticate
      operationId: authenticate
      summary: 'Login user'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: 'info@example.com'
                password:
                  type: string
                  format: password
                  example: '***'
      responses:
        200:
          description: 'Successful'
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: 'eyfcxzcfd0gmcvzmmadsasdavvcn...'
        401:
          $ref: '#/components/responses/Unauthorized'
        422:
          $ref: '#/components/responses/ValidationExceptions'
    delete:
      tags:
        - Authenticate
      operationId: logout
      security:
        - jwt: []
      summary: 'Logout user'
      responses:
        204:
          description: 'No Content'
        401:
          $ref: '#/components/responses/Unauthorized'
  /register:
    post:
      tags:
        - Register
      summary: 'Register user'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: 'Alexandr'
                email:
                  type: string
                  example: 'test@mail.ru'
                password:
                  type: string
                  format: password
                  example: '***'
                password_confirmation:
                  type: string
                  format: password
                  example: '***'
              required:
                - name
                - email
                - password
                - password_confirmation
      responses:
        201:
          $ref: '#/components/responses/Success'
        422:
          $ref: '#/components/responses/ValidationExceptions'
  /catalog:
    get:
      tags:
        - Catalog
      summary: 'Product listing'
      parameters:
        - name: 'filter[brands][]'
          in: query
          required: false
          style: deepObject
          explode: true
          schema:
            type: array
            items:
              type: integer
        - name: 'filter[price][from]'
          in: query
          required: false
          schema:
            type: integer
        - name: 'filter[price][to]'
          in: query
          required: false
          schema:
            type: integer
        - name: 'sort'
          in: query
          required: false
          schema:
            type: string
            enum:
              - 'title'
              - '-title'
              - 'price'
              - '-price'
        - name: 'page'
          in: query
          required: false
          schema:
            type: integer
            default: 1
      responses:
        200:
          description: 'Successful'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductsCollection'
  /cart:
    get:
      tags:
        - Cart
      summary: 'Cart items'
      operationId: 'cartIndex'
      security:
        - jwt: [ ]
      responses:
        200:
          description: 'Successful'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CartProduct'
    delete:
      tags:
        - Cart
      summary: 'Truncate'
      operationId: 'truncate'
      security:
        - jwt: [ ]
      responses:
        204:
          description: 'No Content'
        401:
          $ref: '#/components/responses/Unauthorized'
  /cart/{id}:
    put:
      tags:
        - Cart
      operationId: 'quantity'
      summary: 'Update quantity'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            oneOf:
              - type: integer
              - type: string
        - name: quantity
          in: query
          required: true
          schema:
            type: integer
      responses:
        204:
          description: 'No Content'
        401:
          $ref: '#/components/responses/Unauthorized'
        422:
          $ref: '#/components/responses/ValidationExceptions'
    delete:
      tags:
        - Cart
      operationId: 'cartDelete'
      summary: 'Delete cart item'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            oneOf:
              - type: integer
              - type: string
      responses:
        204:
          description: 'No Content'
        401:
          $ref: '#/components/responses/Unauthorized'
        422:
          $ref: '#/components/responses/ValidationExceptions'
components:
  securitySchemes:
    jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Product:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
    CartProduct:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        quantity:
          type: integer
        price:
          type: integer
    ProductsCollection:
      type: object
      properties:
        current_page:
          type: string
          default: 1
        first_page_url:
          type: string
        from:
          type: integer
          default: 1
        next_page_url:
          type: string
          nullable: true
        prev_page_url:
          type: string
          nullable: true
        to:
          type: integer
        path:
          type: string
        per_page:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
  responses:
    ValidationExceptions:
      description: 'Validation errors'
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
              errors:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
    Unauthorized:
      description: 'Unauthorized'
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
    Success:
      description: 'Success'
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
